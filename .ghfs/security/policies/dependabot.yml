## What is Dependabot?

Dependabot automatically:
- Checks for dependency updates
- Opens pull requests to update dependencies
- Alerts you to security vulnerabilities
- Keeps dependencies up to date

## Recommended Configuration

Create `.github/dependabot.yml` with:

```yaml
version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group all non-major updates together
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Automatically approve and merge minor/patch updates
    reviewers:
      - "agustif"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
```

## Benefits of Dependabot

1. **Security**: Automatic security updates for vulnerable dependencies
2. **Freshness**: Keep dependencies up to date without manual effort
3. **Convenience**: PRs are automatically opened and tested by CI
4. **Grouping**: Can group related updates to reduce PR noise
5. **Customization**: Fine-grained control over update frequency and behavior

